<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Student Expense Tracker</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
</head>
<body>

<header>
  <div class="logo">ExpenseIQ <span>Student Edition</span></div>
  <div class="header-right">
    <div class="month-badge" id="cur-month-badge">May 2026</div>
  </div>
</header>

<div class="container">

  <!-- SUMMARY -->
  <div class="summary-grid">
    <div class="metric gold">
      <div class="metric-label">Total Spent</div>
      <div class="metric-value" id="s-spent">₹0</div>
      <div class="metric-sub" id="s-spent-sub">this month</div>
    </div>
    <div class="metric grn">
      <div class="metric-label">Monthly Budget</div>
      <div class="metric-value" id="s-budget">₹0</div>
      <div class="metric-sub">set per category</div>
    </div>
    <div class="metric red">
      <div class="metric-label">Remaining</div>
      <div class="metric-value" id="s-remaining">₹0</div>
      <div class="metric-sub" id="s-rem-sub">available</div>
    </div>
    <div class="metric blu">
      <div class="metric-label">Transactions</div>
      <div class="metric-value" id="s-count">0</div>
      <div class="metric-sub" id="s-avg">avg ₹0 each</div>
    </div>
  </div>

  <!-- MAIN GRID -->
  <div class="main-grid">

    <!-- LEFT: ADD FORM -->
    <div class="card" style="align-self: start;">
      <div class="card-header">Add Expense <span class="sub">log a new entry</span></div>
      <div class="form-group">
        <label>Description</label>
        <input type="text" id="f-desc" placeholder="e.g. Canteen lunch, Bus pass…" />
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Amount (₹)</label>
          <input type="number" id="f-amount" placeholder="0" min="0" step="1" />
        </div>
        <div class="form-group">
          <label>Date</label>
          <input type="date" id="f-date" />
        </div>
      </div>
      <div class="form-group">
        <label>Category</label>
        <select id="f-cat">
          <option value="food">🍽️ Food & Dining</option>
          <option value="transport">🚌 Transport</option>
          <option value="books">📚 Books & Supplies</option>
          <option value="health">💊 Health & Medicine</option>
          <option value="entertainment">🎬 Entertainment</option>
          <option value="rent">🏠 Rent & Utilities</option>
          <option value="clothing">👕 Clothing</option>
          <option value="other">📦 Other</option>
        </select>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Payment Mode</label>
          <select id="f-mode">
            <option>Cash</option>
            <option>UPI</option>
            <option>Card</option>
            <option>Net Banking</option>
          </select>
        </div>
        <div class="form-group">
          <label>Month</label>
          <select id="f-month">
            <option>January</option><option>February</option><option>March</option>
            <option>April</option><option selected>May</option><option>June</option>
            <option>July</option><option>August</option><option>September</option>
            <option>October</option><option>November</option><option>December</option>
          </select>
        </div>
      </div>
      <button class="btn-primary" onclick="addExpense()">+ Add Expense</button>
    </div>

    <!-- RIGHT: TABS -->
    <div class="card">
      <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('expenses')">Expenses</button>
        <button class="tab-btn" onclick="switchTab('chart')">Chart</button>
        <button class="tab-btn" onclick="switchTab('budget')">Budget</button>
        <button class="tab-btn" onclick="switchTab('analytics')">Analytics</button>
      </div>

      <!-- EXPENSES TAB -->
      <div class="tab-panel active" id="tab-expenses">
        <div class="search-panel">
          <input id="search-input" type="search" placeholder="Search expenses, category, payment or month" oninput="setSearch(this.value)" />
          <select id="filter-select" onchange="setFilterOption(this.value)">
            <option value="all">Show all</option>
            <optgroup label="Categories">
              <option value="food">Food & Dining</option>
              <option value="transport">Transport</option>
              <option value="books">Books & Supplies</option>
              <option value="health">Health & Medicine</option>
              <option value="entertainment">Entertainment</option>
              <option value="rent">Rent & Utilities</option>
              <option value="clothing">Clothing</option>
              <option value="other">Other</option>
            </optgroup>
            <optgroup label="Payment mode">
              <option value="Cash">Cash</option>
              <option value="UPI">UPI</option>
              <option value="Card">Card</option>
              <option value="Net Banking">Net Banking</option>
            </optgroup>
          </select>
        </div>
        <div class="filter-bar" id="filter-bar"></div>
        <div class="expense-list" id="expense-list">
          <div class="empty-state">
            <div class="icon">🪙</div>
            No expenses yet.<br/>Add one using the form.
          </div>
        </div>
      </div>

      <!-- CHART TAB -->
      <div class="tab-panel" id="tab-chart">
        <div class="chart-wrap">
          <canvas id="donut-chart" role="img" aria-label="Donut chart showing spending by category">Spending by category.</canvas>
        </div>
        <div class="legend-grid" id="legend-grid"></div>
      </div>

      <!-- BUDGET TAB -->
      <div class="tab-panel" id="tab-budget">
        <div id="budget-list"></div>
      </div>

      <!-- ANALYTICS TAB -->
      <div class="tab-panel" id="tab-analytics">
        <div class="card-header" style="margin-bottom:1rem; font-size:0.95rem;">Category Breakdown</div>
        <div class="bar-chart" id="analytics-bars"></div>
      </div>

    </div>
  </div>
</div>

<script>
const CATS = {
  food:          { label: 'Food & Dining',    icon: '🍽️', color: '#f5a25d' },
  transport:     { label: 'Transport',         icon: '🚌', color: '#5fcf8a' },
  books:         { label: 'Books & Supplies',  icon: '📚', color: '#6ab0f5' },
  health:        { label: 'Health & Medicine', icon: '💊', color: '#f591b8' },
  entertainment: { label: 'Entertainment',     icon: '🎬', color: '#b39ddb' },
  rent:          { label: 'Rent & Utilities',  icon: '🏠', color: '#e8c97a' },
  clothing:      { label: 'Clothing',          icon: '👕', color: '#5dd4c0' },
  other:         { label: 'Other',             icon: '📦', color: '#8a8a9a' },
};

let expenses = [];
let budgets = { food:0, transport:0, books:0, health:0, entertainment:0, rent:0, clothing:0, other:0 };
let filterCat = 'all';
let searchQuery = '';
let filterOption = 'all';
let currentTab = 'expenses';
let donutChart = null;

const fmt = n => '₹' + Math.round(n).toLocaleString('en-IN');

// Load data from backend
async function loadData() {
  try {
    const [expensesRes, budgetsRes] = await Promise.all([
      fetch('/api/expenses'),
      fetch('/api/budgets')
    ]);
    expenses = await expensesRes.json();
    budgets = await budgetsRes.json();
    update();
  } catch (error) {
    console.error('Error loading data:', error);
  }
}

// Set default date
document.getElementById('f-date').value = new Date().toISOString().slice(0,10);

// Month badge
const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
document.getElementById('cur-month-badge').textContent = months[new Date().getMonth()] + ' ' + new Date().getFullYear();

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach((b,i) => b.classList.toggle('active', ['expenses','chart','budget','analytics'][i] === tab));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
  if (tab === 'chart') renderChart();
  if (tab === 'budget') renderBudget();
  if (tab === 'analytics') renderAnalytics();
}

function setSearch(value) {
  searchQuery = value.trim().toLowerCase();
  renderList();
}

function setFilterOption(value) {
  filterOption = value;
  renderList();
}

function applySearchAndFilter(list) {
  return list.filter(e => {
    const text = `${e.desc} ${CATS[e.cat].label} ${e.mode} ${e.date} ${e.month}`.toLowerCase();
    const matchesSearch = !searchQuery || text.includes(searchQuery);
    const matchesCategory = filterCat === 'all' || e.cat === filterCat;
    const matchesOption = filterOption === 'all'
      || e.cat === filterOption
      || e.mode === filterOption;
    return matchesSearch && matchesCategory && matchesOption;
  });
}

async function addExpense() {
  const desc = document.getElementById('f-desc').value.trim();
  const amount = parseFloat(document.getElementById('f-amount').value);
  const cat = document.getElementById('f-cat').value;
  const date = document.getElementById('f-date').value;
  const mode = document.getElementById('f-mode').value;
  const month = document.getElementById('f-month').value;
  if (!desc) { alert('Please enter a description.'); return; }
  if (isNaN(amount) || amount <= 0) { alert('Please enter a valid amount.'); return; }
  try {
    const response = await fetch('/api/expenses', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ desc, amount, cat, date, mode, month })
    });
    if (response.ok) {
      const newExpense = await response.json();
      expenses.push(newExpense);
      document.getElementById('f-desc').value = '';
      document.getElementById('f-amount').value = '';
      update();
    } else {
      const errorText = await response.text();
      console.error('Error adding expense:', response.status, errorText);
      alert('Error adding expense: ' + response.status);
    }
  } catch (error) {
    console.error('Error:', error);
    alert('Error adding expense (exception)');
  }
}

async function deleteExpense(id) {
  try {
    const response = await fetch(`/api/expenses/${id}`, { method: 'DELETE' });
    if (response.ok) {
      expenses = expenses.filter(e => e.id !== id);
      update();
    } else {
      alert('Error deleting expense');
    }
  } catch (error) {
    console.error('Error:', error);
    alert('Error deleting expense');
  }
}

function update() {
  const total = expenses.reduce((s,e) => s+e.amount, 0);
  const totalBudget = Object.values(budgets).reduce((s,v) => s+(parseFloat(v)||0), 0);
  const remaining = totalBudget - total;
  const count = expenses.length;

  document.getElementById('s-spent').textContent = fmt(total);
  document.getElementById('s-budget').textContent = fmt(totalBudget);
  const remEl = document.getElementById('s-remaining');
  remEl.textContent = fmt(Math.abs(remaining));
  remEl.className = 'metric-value ' + (remaining < 0 ? 'danger' : remaining > 0 ? 'safe' : '');
  document.getElementById('s-rem-sub').textContent = remaining < 0 ? 'over budget!' : 'available';
  document.getElementById('s-count').textContent = count;
  document.getElementById('s-avg').textContent = count ? 'avg ' + fmt(total/count) + ' each' : 'no entries';

  renderFilterBar();
  renderList();
  if (currentTab === 'chart') renderChart();
  if (currentTab === 'budget') renderBudget();
  if (currentTab === 'analytics') renderAnalytics();
}

function renderFilterBar() {
  const used = ['all', ...new Set(expenses.map(e => e.cat))];
  document.getElementById('filter-bar').innerHTML = used.map(k =>
    `<div class="filter-chip ${filterCat===k?'active':''}" onclick="setFilter('${k}')">
      ${k==='all' ? 'All' : CATS[k].icon + ' ' + CATS[k].label}
    </div>`
  ).join('');
}

function setFilter(cat) {
  filterCat = cat;
  renderFilterBar();
  renderList();
}

function renderList() {
  const el = document.getElementById('expense-list');
  const filtered = applySearchAndFilter(expenses);
  if (!filtered.length) {
    const emptyText = searchQuery
      ? 'No expenses match your search.'
      : filterCat !== 'all'
        ? 'No expenses in this category.'
        : 'No expenses yet.';
    el.innerHTML = `<div class="empty-state"><div class="icon">🔍</div>${emptyText}</div>`;
    return;
  }
  el.innerHTML = filtered.map(e => {
    const c = CATS[e.cat];
    return `<div class="expense-item">
      <div class="cat-dot" style="background:${c.color}22;">${c.icon}</div>
      <div class="expense-info">
        <div class="expense-name">${e.desc}</div>
        <div class="expense-meta">${c.label} · ${e.mode}${e.date ? ' · ' + e.date : ''}${e.month ? ' · ' + e.month : ''}</div>
      </div>
      <div class="expense-amount">${fmt(e.amount)}</div>
      <button class="del-btn" onclick="deleteExpense(${e.id})" title="Delete">×</button>
    </div>`;
  }).join('');
}

function renderChart() {
  const totals = {};
  expenses.forEach(e => { totals[e.cat] = (totals[e.cat]||0) + e.amount; });
  const cats = Object.keys(totals);
  if (!cats.length) {
    if (donutChart) { donutChart.destroy(); donutChart = null; }
    document.getElementById('legend-grid').innerHTML = '<div style="color:var(--muted);font-size:13px;padding:1rem 0;">No data yet.</div>';
    return;
  }
  const total = cats.reduce((s,k) => s+totals[k], 0);
  const labels = cats.map(k => CATS[k].label);
  const data = cats.map(k => Math.round(totals[k]));
  const colors = cats.map(k => CATS[k].color);

  if (donutChart) donutChart.destroy();
  donutChart = new Chart(document.getElementById('donut-chart'), {
    type: 'doughnut',
    data: { labels, datasets: [{ data, backgroundColor: colors, borderWidth: 0, hoverOffset: 6 }] },
    options: {
      responsive: true, maintainAspectRatio: false,
      cutout: '65%',
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: { label: ctx => ` ${ctx.label}: ${fmt(ctx.parsed)} (${Math.round(ctx.parsed/total*100)}%)` }, backgroundColor: '#1e2029', titleColor: '#f0efe8', bodyColor: '#8a8a9a', borderColor: 'rgba(255,255,255,0.07)', borderWidth: 1 }
      }
    }
  });

  document.getElementById('legend-grid').innerHTML = cats.map(k =>
    `<div class="legend-item">
      <div class="legend-dot" style="background:${CATS[k].color}"></div>
      ${CATS[k].label} — ${Math.round(totals[k]/total*100)}%
    </div>`
  ).join('');
}

function renderBudget() {
  const totals = {};
  expenses.forEach(e => { totals[e.cat] = (totals[e.cat]||0) + e.amount; });

  document.getElementById('budget-list').innerHTML = Object.keys(CATS).map(k => {
    const c = CATS[k];
    const spent = Math.round(totals[k]||0);
    const budget = parseFloat(budgets[k])||0;
    const pct = budget > 0 ? Math.min(100, Math.round(spent/budget*100)) : 0;
    const over = budget > 0 && spent > budget;
    const barColor = over ? '#f06b6b' : c.color;
    return `<div class="budget-row">
      <div class="budget-top">
        <div class="budget-cat"><span>${c.icon}</span> ${c.label}</div>
        <div class="budget-right">
          <span class="budget-spent">${fmt(spent)} spent</span>
          <span style="font-size:12px;color:var(--muted);">/ ₹</span>
          <input class="budget-input" type="number" min="0" step="100" value="${budgets[k]||''}" placeholder="0"
            oninput="setBudget('${k}', this.value)" />
        </div>
      </div>
      <div class="progress-bg">
        <div class="progress-fill" style="width:${pct}%;background:${barColor};"></div>
      </div>
      <div class="progress-label ${over?'over':''}">
        ${budget > 0 ? (over ? `Over by ${fmt(spent-budget)}` : `${pct}% used · ${fmt(budget-spent)} remaining`) : 'No budget set'}
      </div>
    </div>`;
  }).join('');
}

async function setBudget(cat, val) {
  budgets[cat] = parseFloat(val) || 0;
  try {
    await fetch('/api/budgets', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(budgets)
    });
  } catch (error) {
    console.error('Error updating budgets:', error);
  }
  const total = expenses.reduce((s,e)=>s+e.amount,0);
  const totalBudget = Object.values(budgets).reduce((s,v)=>s+(parseFloat(v)||0),0);
  const rem = totalBudget - total;
  document.getElementById('s-budget').textContent = fmt(totalBudget);
  const remEl = document.getElementById('s-remaining');
  remEl.textContent = fmt(Math.abs(rem));
  remEl.className = 'metric-value ' + (rem < 0 ? 'danger' : rem > 0 ? 'safe' : '');
  document.getElementById('s-rem-sub').textContent = rem < 0 ? 'over budget!' : 'available';
}

function renderAnalytics() {
  const totals = {};
  expenses.forEach(e => { totals[e.cat] = (totals[e.cat]||0) + e.amount; });
  const max = Math.max(...Object.values(totals), 1);
  if (!Object.keys(totals).length) {
    document.getElementById('analytics-bars').innerHTML = '<div style="color:var(--muted);font-size:13px;padding:1rem 0;">No data yet.</div>';
    return;
  }
  document.getElementById('analytics-bars').innerHTML = Object.keys(CATS)
    .filter(k => totals[k])
    .sort((a,b) => (totals[b]||0)-(totals[a]||0))
    .map(k => {
      const pct = Math.round((totals[k]||0)/max*100);
      return `<div class="bar-row">
        <div class="bar-label">${CATS[k].icon} ${CATS[k].label}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${CATS[k].color};"></div></div>
        <div class="bar-val">${fmt(totals[k]||0)}</div>
      </div>`;
    }).join('');
}

// ── SAMPLE DATA ──
expenses = [
 ]
update();
</script>
</body>
</html>
